<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>EVOLUTION SBN 2027</title><style>*{box-sizing:border-box}body{margin:0;background:#080f20;color:white;font:16px system-ui;overflow:hidden;touch-action:none}canvas{position:absolute;width:100vw;height:100vh}#menu,#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse,#173b53,#080f20 75%);z-index:3}section{width:min(520px,95vw);max-height:98vh;overflow:auto;text-align:center;padding:12px}h1{font-size:clamp(25px,5vw,48px);margin:0;color:#43ffd1;letter-spacing:4px;text-shadow:0 0 25px #43ffd1}small{color:#9ab6cc}input,button{padding:9px 13px;border:1px solid #3d6074;border-radius:10px;background:#16283e;color:white;font:inherit;margin:3px}input{width:44%}button{font-weight:bold;background:#166557;cursor:pointer}#server{width:94%}#hud{position:absolute;top:10px;left:12px;pointer-events:none}#rank{position:absolute;right:10px;top:10px;background:#08101dcc;padding:9px;border-radius:10px;font-size:12px;white-space:pre-line}#exit{position:absolute;left:10px;top:65px}#stick,#boost{position:absolute;bottom:22px;border:2px solid #70e9dd88;background:#143b4a88;border-radius:50%;width:104px;height:104px;display:grid;place-items:center;user-select:none}#stick{left:24px}#boost{right:24px;width:85px;height:85px}#knob{width:40px;height:40px;background:#43ffd1;border-radius:50%;pointer-events:none}[hidden]{display:none!important}</style><canvas id="cv"></canvas><div id="hud"></div><div id="rank"></div><button id="exit">Salir</button><div id="stick"><div id="knob"></div></div><div id="boost">⚡ TURBO</div><div id="menu"><section><small>ARENA MULTIJUGADOR</small><h1>EVOLUTION<br>SBN 2027</h1><p id="status">Crece. Evoluciona. Domina.</p><input id="nick" maxlength="20" placeholder="Tu nombre" value="Jugador"><input id="code" maxlength="12" placeholder="Código de sala"><input id="server" placeholder="Servidor wss://..." ><br><button id="solo">Entrenamiento</button><button id="create">Crear sala</button><button id="join">Unirse</button><p><small>Joystick para girar · Turbo consume masa</small></p></section></div><div id="load"><section><h1>EVOLUTION SBN 2027</h1><p>Cargando arena...</p></section></div><script src="engine.js"></script><script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');let state=null,id='me',socket,local=false,a=0,b=false,active=false,frame=0,room='',rank=[],target=null;function menu(msg){active=false;if(socket){socket.onclose=null;socket.close();socket=null}$('menu').hidden=false;$('status').textContent=msg||'Crece. Evoluciona. Domina.';b=false}function start(){active=true;$('menu').hidden=true;a=0;b=false;target=null}setTimeout(()=> $('load').hidden=true,1100);$('solo').onclick=()=>{local=true;id='me';state=Game.world();Game.spawn(state,id,$('nick').value);for(let i=0;i<18;i++)Game.spawn(state,'bot'+i,'Bot '+(i+1));start()};$('server').value=localStorage.getItem('server')||'';function online(create){let url=$('server').value.trim(),code=create?Math.random().toString(36).slice(2,8).toUpperCase():$('code').value.trim().toUpperCase();if(!/^wss:\/\//.test(url)||!code)return menu('Introduce servidor wss:// y código de sala');localStorage.setItem('server',url);$('code').value=code;room=code;local=false;state=null;try{socket=new WebSocket(url)}catch{return menu('Servidor inválido')}$('status').textContent='Conectando...';socket.onopen=()=>socket.send(JSON.stringify({type:'join',code,name:$('nick').value}));socket.onmessage=e=>{let m=JSON.parse(e.data);if(m.error)return menu(m.error);if(m.id){id=m.id;start()}else if(m.dead)menu('¡Fin de partida! Vuelve a jugar.');else{state={p:Object.fromEntries(m.p.map(p=>[p.id,p])),f:m.f};rank=m.rank}};socket.onclose=()=>menu('Conexión cerrada');socket.onerror=()=>menu('No se pudo conectar')}$('create').onclick=()=>online(true);$('join').onclick=()=>online(false);$('exit').onclick=()=>menu();function steer(e){let r=$('stick').getBoundingClientRect(),x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;if(Math.hypot(x,y)>4)a=Math.atan2(y,x);let l=Math.max(1,Math.hypot(x,y)/33);$('knob').style.transform=`translate(${x/l}px,${y/l}px)`} $('stick').onpointerdown=e=>{$('stick').setPointerCapture(e.pointerId);steer(e)};$('stick').onpointermove=e=>{if($('stick').hasPointerCapture(e.pointerId))steer(e)};$('stick').onpointerup=$('stick').onpointercancel=()=>{$('knob').style.transform=''};$('boost').onpointerdown=e=>{$('boost').setPointerCapture(e.pointerId);b=true};$('boost').onpointerup=$('boost').onpointercancel=$('boost').onlostpointercapture=()=>b=false;cv.onpointermove=e=>{if(e.buttons)a=Math.atan2(e.clientY-innerHeight/2,e.clientX-innerWidth/2)};setInterval(()=>{if(!active)return;if(local){let p=state.p[id];if(!p)return menu('¡Fin de partida!');p.t=a;p.b=b;for(let i=0;i<18;i++){let k='bot'+i,q=state.p[k]||Game.spawn(state,k,'Bot '+(i+1)),h=q.body[0];if(h[0]<150||h[1]<150||h[0]>3850||h[1]>3850)q.t=Math.atan2(2000-h[1],2000-h[0]);else if(Math.random()<.05)q.t+=Math.random()*2-1}Game.step(state);rank=Object.values(state.p).sort((a,b)=>b.m-a.m).slice(0,10).map(q=>[q.name,Math.floor(q.m)])}else if(socket?.readyState===1)socket.send(JSON.stringify({type:'input',a,b}))},50);function draw(){requestAnimationFrame(draw);let w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio,2);if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d)}ctx.setTransform(d,0,0,d,0,0);ctx.fillStyle='#080f20';ctx.fillRect(0,0,w,h);let p=state?.p[id];if(!active||!p)return;let head=p.body[0];if(!target)target=[...head];target[0]+=(head[0]-target[0])*.28;target[1]+=(head[1]-target[1])*.28;let x=target[0]-w/2,y=target[1]-h/2;ctx.translate(-x,-y);ctx.strokeStyle='#16263b';ctx.lineWidth=1;for(let i=Math.floor(x/50)*50;i<x+w;i+=50){ctx.beginPath();ctx.moveTo(i,y);ctx.lineTo(i,y+h);ctx.stroke()}for(let i=Math.floor(y/50)*50;i<y+h;i+=50){ctx.beginPath();ctx.moveTo(x,i);ctx.lineTo(x+w,i);ctx.stroke()}ctx.strokeStyle='#ff527d';ctx.lineWidth=6;ctx.strokeRect(0,0,4000,4000);for(let f of state.f){if(f[0]<x-10||f[0]>x+w+10||f[1]<y-10||f[1]>y+h+10)continue;ctx.fillStyle=Game.colors[Math.floor(f[0])%5];ctx.beginPath();ctx.arc(f[0],f[1],3+f[2],0,7);ctx.fill()}for(let q of Object.values(state.p)){ctx.lineJoin='round';ctx.lineCap='round';ctx.strokeStyle=q.c;ctx.lineWidth=19;ctx.beginPath();q.body.forEach((v,i)=>i?ctx.lineTo(...v):ctx.moveTo(...v));ctx.stroke();let [hx,hy]=q.body[0];ctx.fillStyle='white';for(let side of [-1,1]){let ex=hx+Math.cos(q.a)*5+Math.sin(q.a)*side*5,ey=hy+Math.sin(q.a)*5-Math.cos(q.a)*side*5;ctx.beginPath();ctx.arc(ex,ey,3.5,0,7);ctx.fill()}ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText(q.name,hx,hy-16)}$('hud').textContent='Masa: '+Math.floor(p.m)+' · '+(local?'Entrenamiento':'Sala '+room);$('rank').textContent='TOP 10\n'+rank.map((r,i)=>`${i+1}. ${r[0]} · ${r[1]}`).join('\n')}draw();</script></html>
