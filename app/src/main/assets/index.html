// Nine vector fruit sprites are drawn once to small canvases; no emoji/font dependency.
const fruitSprites=Array.from({length:9},(_,i)=>{let c=document.createElement('canvas');c.width=c.height=48;let g=c.getContext('2d');g.translate(24,24);function ellipse(x,y,rx,ry,col,rot=0){g.beginPath();g.ellipse(x,y,rx,ry,rot,0,Math.PI*2);g.fillStyle=col;g.fill()}function line(x,y,X,Y,col,th=3){g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.strokeStyle=col;g.lineWidth=th;g.lineCap='round';g.stroke()}function leaf(x,y,r=0){ellipse(x,y,8,4,'#68b83e',r)}function shape(col,fn){g.beginPath();fn();g.closePath();g.fillStyle=col;g.fill()}switch(i){case 0:ellipse(-6,2,11,13,'#e44342',-.3);ellipse(6,2,11,13,'#fb5950',.3);line(0,-10,2,-18,'#79482d');leaf(8,-14,-.5);ellipse(-8,-3,3,6,'#ffac9f',.3);break;case 1:ellipse(0,0,16,16,'#f59b2e');ellipse(-5,-5,7,6,'#ffbd55');leaf(7,-15,-.45);break;case 2:shape('#e94758',()=>{g.moveTo(-15,-8);g.bezierCurveTo(-22,0,-8,18,0,19);g.bezierCurveTo(9,18,22,0,15,-8);g.quadraticCurveTo(0,-16,-15,-8)});for(let j=0;j<8;j++)ellipse((j%3-1)*8+(j%2)*2,Math.floor(j/3)*8-5,1.3,2,'#ffe7a6');leaf(-5,-12,.4);leaf(5,-12,-.4);break;case 3:shape('#f7d33f',()=>{g.moveTo(-18,-13);g.quadraticCurveTo(-10,13,16,-4);g.lineTo(20,2);g.quadraticCurveTo(-8,28,-20,-6)});line(-18,-13,-16,-17,'#9a642c');break;case 4:for(let j=0;j<7;j++)ellipse((j%3-1)*9,(Math.floor(j/3)-1)*9,6,6,j%2?'#8252c9':'#ad76f2');leaf(0,-16,-.4);break;case 5:shape('#55b46a',()=>{g.moveTo(-19,-10);g.lineTo(19,-10);g.arc(0,-10,19,0,Math.PI)});shape('#f35c69',()=>{g.moveTo(-15,-10);g.lineTo(15,-10);g.arc(0,-10,15,0,Math.PI)});for(let j=-1;j<=1;j++)ellipse(j*7,-5+3*(1-Math.abs(j)),1.5,2.5,'#352132');break;case 6:ellipse(0,4,11,15,'#e5ad38');for(let j=0;j<3;j++){line(-8,-3+j*7,8,4+j*7,'#a66a30',1.4);line(8,-3+j*7,-8,4+j*7,'#a66a30',1.4)}leaf(-5,-14,-1.9);leaf(5,-14,-1.1);leaf(0,-17,-1.57);break;case 7:line(-8,-1,0,-16,'#62a847');line(10,1,0,-16,'#62a847');ellipse(-9,5,8,8,'#de304e');ellipse(10,7,8,8,'#f54b5e');leaf(6,-16,-.5);break;case 8:ellipse(0,3,11,16,'#edb64c',.45);ellipse(-4,-1,5,9,'#ffce63',.45) function fruitDraw(f,x,y){const sp=fruitSprites[(Number.isInteger(f[3])?f[3]:0)%fruitSprites.length]||fruitSprites[0],sz=23+Math.min(3,f[2])*2;ctx.drawImage(sp,x-sz/2,y-sz/2,sz,sz);}

const menuColors=['#9b5144','#577d45','#583d83','#796530','#3f767c'];let menuFrame=0;function menuDraw(t){if(t-menuFrame<33)return;menuFrame=t;ctx.fillStyle='#0a1723';ctx.fillRect(0,0,w,h);for(let j=0;j<5;j++){let r=Math.max(24,Math.min(w,h)*.105),pts=[];let speed=(j%2?1:-1),travel=((t*.035*(1+j*.12)+j*213)%(w+500))-250;for(let i=0;i<39;i++){let x=(speed>0?travel:w-travel)-speed*i*r*.28,y=h*(j+.4)/5+Math.sin(i*.15+t*.0015+j)*r*1.35;pts.push([x,y]);}worm(pts,Math.atan2(pts[0][1]-pts[1][1],pts[0][0]-pts[1][0]),menuColors[j],r,j===2,true);}}
