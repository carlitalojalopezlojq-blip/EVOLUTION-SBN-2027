name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de lanzamiento
        run: npm run test:launch
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.2
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug
      - name: Firmar APK con clave permanente y verificar
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.EVOLUTION_ANDROID_SIGNING }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo 'Falta el secreto EVOLUTION_ANDROID_SIGNING. No se publicara un APK con firma temporal.' >&2
            exit 1
          fi
          signing_dir=$(mktemp -d "$RUNNER_TEMP/evolution-signing.XXXXXX")
          trap 'rm -rf -- "$signing_dir"' EXIT
          printf '%s' "$SIGNING_BUNDLE" | base64 --decode | tar -xzf - -C "$signing_dir"
          unset SIGNING_BUNDLE
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          mkdir -p "$RUNNER_TEMP/evolution-apk"
          "$signer" sign --ks "$signing_dir/evolution.p12" --ks-type PKCS12 --ks-key-alias evolution --ks-pass "file:$signing_dir/password.txt" --v4-signing-enabled false --out "$RUNNER_TEMP/evolution-apk/app-debug.apk" app/build/outputs/apk/debug/app-debug.apk
          "$signer" verify --verbose --print-certs "$RUNNER_TEMP/evolution-apk/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: EVOLUTION-SBN-2027-APK
          path: ${{ runner.temp }}/evolution-apk/app-debug.apk
          if-no-files-found: error
